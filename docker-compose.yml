services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wattfrosch
      POSTGRES_PASSWORD: wattfrosch
      POSTGRES_DB: wattfrosch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattfrosch -d wattfrosch"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
